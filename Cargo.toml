num-traits = "0.2"
ordered-float = "5.1"
pretty_assertions = "1.4"
rowan = "0.16"
rustc-hash = "1.1"
salsa = "0.26"
serde = "1.0"
text-size = "1.1"
toml = "1.0"
url = "2.5.8"
walkdir = "2"

