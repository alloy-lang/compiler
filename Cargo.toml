[workspace]
members = [
    "compiler",
    "compiler/ast",
     "compiler/hir",
    # "compiler/hir_index",  # Temporarily disabled due to API changes
     "compiler/hir_ty",
    "compiler/lexer",
    "compiler/parser",
    "compiler/project",
    "compiler/scope",
    "compiler/syntax",
    "compiler/test_harness",
    "compiler/workspace",
    "smith/repl",
]

