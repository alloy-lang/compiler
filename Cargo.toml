[workspace]
members = [
    "compiler",
    "compiler/ast",
    "compiler/diagnostics",
    "compiler/hir_parent/hir",
    "compiler/hir_parent/hir_resolved",
    "compiler/hir_parent/hir_ty",
    "compiler/lexer",
    "compiler/parser",
    "compiler/project",
    "compiler/scope",
    "compiler/syntax",
    "compiler/test_harness",
