ordered-float = "3.0"
pretty_assertions = "1.2"
rowan = "0.15"
rustc-hash = "1.1"
salsa = "0.24.0"
serde = "1.0"
text-size = "1.1"
toml = "0.8"
url = "2.5.0"
walkdir = "2"

